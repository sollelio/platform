<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Neutro e público: é o que se vê na pré-visualização do WhatsApp e no
         instante antes de o JS acordar. Cada área repõe o seu — o portal
         escreve «O seu acompanhamento», o backoffice «Sistema DLM». -->
    <title>Do Luxo à Mesa</title>

    <!-- O cartão de pré-visualização das conversas (WhatsApp e afins).
         Estático e igual para todas as páginas, de propósito: a marca é o
         que dá confiança ao endereço — o assunto muda, a cara não — e
         nenhum dado de evento entra aqui. As palavras são as do desenho
         «O cartão de pré-visualização». -->
    <meta property="og:site_name" content="Do Luxo à Mesa" />
    <meta property="og:title" content="Do Luxo à Mesa" />
    <meta
      property="og:description"
      content="Uma folha da Do Luxo à Mesa, para ler e partilhar com quem prepara o dia."
    />
    <meta property="og:type" content="website" />
    <!-- cartao-comunicado.png ainda não existe: o dono exporta-o do Design (1200×630, creme e dourado) para public/. -->
    <meta property="og:image" content="https://doluxoamesa.pt/cartao-comunicado.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!--
      AS FONTES DA CASA carregam-se AQUI, e não por @import no index.css.

      Estavam lá e NUNCA chegaram a carregar: a linha 1 do index.css é
      `@import "tailwindcss"`, que o plugin do Tailwind v4 substitui por
      milhares de linhas de CSS. O @import das fontes, que vinha a seguir,
      deixava de estar no topo da folha — e o CSS obriga os @import a
      precederem todas as outras regras, por isso era descartado em
      silêncio. A aplicação inteira pintava em Noto Serif / Noto Sans.

      Aqui não há ordem que se possa perder, e o preconnect abre a ligação
      antes de o CSS ser pedido.

      Inter 700 é o peso dos OVERLINES, o gesto tipográfico mais assinatura
      da casa (identidade-visual.md §2).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
